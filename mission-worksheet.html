<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="description" content="Atlas Academy printable mission worksheet"/><title>Mission Worksheet | Atlas Academy</title><style>body{margin:0;background:#e8f0f5;color:#17384d;font-family:Arial,sans-serif}.sheet{width:8.5in;min-height:11in;margin:24px auto;padding:.55in;box-sizing:border-box;background:white;box-shadow:0 10px 35px #17384d33}.brand{display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid #239bd6;padding-bottom:18px}.brand strong{font-size:28px;color:#07182d}.brand span{font-weight:bold;color:#239bd6}.mission{margin:28px 0;padding:24px;background:#07182d;color:white;border-radius:16px}.mission small{color:#7ed7ff;font-weight:bold;letter-spacing:.12em}.mission h1{margin:8px 0 10px;font-size:32px}.mission p{margin:0;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{min-height:150px;padding:18px;border:1px solid #bfd2de;border-radius:14px}.card b{color:#239bd6}.card h2{margin:7px 0;font-size:20px;color:#07182d}.lines{height:72px;background:repeating-linear-gradient(white,white 22px,#dbe6ed 23px)}.decision{margin-top:18px;padding:18px;border:2px solid #ddb548;border-radius:14px}.decision .lines{height:115px}.footer{display:flex;justify-content:space-between;margin-top:24px;padding-top:12px;border-top:1px solid #ccdbe4;font-size:11px;color:#667d8d}.print{display:block;margin:20px auto;padding:12px 20px;border:0;border-radius:8px;background:#239bd6;color:white;font-weight:bold}@media print{body{background:white}.sheet{margin:0;box-shadow:none}.print{display:none}}@media(max-width:850px){.sheet{width:auto;margin:0;min-height:100vh}.grid{grid-template-columns:1fr}}</style></head><body><button class="print" onclick="window.print()">Print / Save as PDF</button><main class="sheet" id="sheet"></main><script src="days-15-30-content.js"></script><script>(function(){const day=Number(new URLSearchParams(location.search).get('day'));const d=window.ATLAS_ADVANCED_DAYS[day];if(!d){document.getElementById('sheet').textContent='Mission not found.';return}document.title=`Day ${day} - ${d.activityTitle} Worksheet`;document.getElementById('sheet').innerHTML=`<div class="brand"><strong>ATLAS ACADEMY</strong><span>30 DAY TAX OFFICE LAUNCH</span></div><section class="mission"><small>DAY ${String(day).padStart(2,'0')} / ${d.label}</small><h1>${d.activityTitle}</h1><p>${d.activityIntro}</p></section><div class="grid">${d.focuses.map((f,i)=>`<section class="card"><b>0${i+1}</b><h2>${f[0]}</h2><p>${f[1]}</p><div class="lines"></div></section>`).join('')}</div><section class="decision"><b>MISSION DECISION AND EVIDENCE</b><p>${d.reflection}</p><div class="lines"></div></section><div class="footer"><span>Toolkit source begins on page ${d.toolkitPage}</span><span>Name: __________________ Date: __________</span></div>`})();</script></body></html>
